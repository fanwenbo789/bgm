name: Sync Bangumi data

on:
  schedule:
    - cron: '0 4 * * *' # 12:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Bangumi data
        env:
          BGM_TOKEN: ${{ secrets.BGM_TOKEN }}
        run: python sync.py

      - name: Commit data
        run: |
          git config user.name 'fanwenbo789'
          git config user.email '3990891437@qq.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m "同步 Bangumi 数据 $(date -u +%F)"
          git push origin HEAD:main
